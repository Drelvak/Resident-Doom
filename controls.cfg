unbindall
alias +re_up "netevent re_input 4096 1"
alias -re_up "netevent re_input 4096 0"
alias +re_down "netevent re_input 16384 1"
alias -re_down "netevent re_input 16384 0"
alias +re_left "netevent re_input 32768 1"
alias -re_left "netevent re_input 32768 0"
alias +re_right "netevent re_input 8192 1"
alias -re_right "netevent re_input 8192 0"
alias +re_aim "netevent re_input 8 1"
alias -re_aim "netevent re_input 8 0"
alias +re_action "netevent re_input 128 1"
alias -re_action "netevent re_input 128 0"
alias +re_run "netevent re_input 64 1"
alias -re_run "netevent re_input 64 0"
bind uparrow +re_up
bind downarrow +re_down
bind leftarrow +re_left
bind rightarrow +re_right
bind w +re_up
bind s +re_down
bind a +re_left
bind d +re_right
bind x +re_aim
bind c +re_action
bind space +re_action
bind enter +re_action
bind v +re_run
bind shift +re_run
bind z "netevent re_menu"
bind tab "netevent re_menu"
bind i "netevent re_menu"
bind escape "netevent re_escape"
bind f9 menu_load
cl_run false
cl_noprediction true
m_yaw 0
m_pitch 0
r_drawplayersprites false
screenblocks 12
bind f12 "screenshot logs/gui-framebuffer.png"

disableautosave 2

bind f10 menu_quit
snd_sfxvolume 0.8
snd_musicvolume 0.35

// Native Doom sector lighting, without global light amplification.
gl_lightmode 2
re_developer_menu false

re_debug_audio false

bind f8 toggleconsole
